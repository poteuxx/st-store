<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrowserST</title>

<link rel="icon" href="https://i.imgur.com/JrjM1jf.png" type="image/png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0b1220;
    color: #e2e8f0;
}

.hero {
    text-align: center;
    padding: 80px 20px;
    background: linear-gradient(135deg, #1e3a8a, #7c3aed);
}

.hero h1 { font-size: 48px; }

.btn {
    margin-top: 25px;
    display: inline-block;
    padding: 14px 28px;
    background: #2563eb;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.preview {
    padding: 60px 20px;
    text-align: center;
}

.preview img {
    width: 90%;
    max-width: 900px;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.features {
    padding: 60px 20px;
    max-width: 1100px;
    margin: auto;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    border: 1px solid #1f2937;
}

.footer {
    text-align: center;
    padding: 30px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="hero">
    <h1>BrowserST</h1>
    <p>Navigateur rapide, sécurisé et moderne</p>
    <a href="#" class="btn">Buy it Now</a>
</div>

<div class="preview">
    <h2>Preview</h2>
    <img src="screenshot-browser.png" alt="BrowserST">
</div>

<div class="features">
    <h2 style="text-align:center;">Fonctionnalités</h2>

    <div class="grid">
        <div class="card">
            <h3>⚡ Ultra rapide</h3>
            <p>Navigation fluide.</p>
        </div>

        <div class="card">
            <h3>🔒 Sécurité</h3>
            <p>Protection avancée.</p>
        </div>

        <div class="card">
            <h3>🧩 Extensions</h3>
            <p>Support flexible.</p>
        </div>

        <div class="card">
            <h3>🌙 Mode sombre</h3>
            <p>Confort visuel.</p>
        </div>
    </div>
</div>

<div class="footer">
    © SolutionsTechnologie — BrowserST
</div>

</body>
</html>
